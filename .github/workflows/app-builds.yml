# Builds the iPhone and Android apps on GitHub's computers, so you don't need
# a Mac or Android Studio. Run it from the repo's Actions tab: "App builds" →
# "Run workflow". Set the secrets first (see docs/APP_STORE_LAUNCH.md).
#
#   Android: makes a signed .aab to upload to Play Console, and a test .apk
#   iPhone:  builds, signs and uploads straight to App Store Connect
#            (it then appears in TestFlight after Apple processes it)
name: App builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version people see in the store (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      platforms:
        description: "Which apps to build"
        type: choice
        options: [both, android, iphone]
        default: both

permissions:
  contents: read

jobs:
  android:
    if: inputs.platforms != 'iphone'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap add android
      - run: npm run icons
      - name: Firebase settings (notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi
      - run: npx cap sync android
      - name: App settings and version
        env:
          APP_VERSION: ${{ inputs.version }}
          APP_BUILD: ${{ github.run_number }}
        run: node prepare-android.js
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            rm -f "$RUNNER_TEMP/upload.jks"
          else
            echo "::warning::No upload key set, so only the test APK was made. See docs/APP_STORE_LAUNCH.md."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: clearspring-android-${{ inputs.version }}-${{ github.run_number }}
          path: |
            native/android/app/build/outputs/bundle/release/*.aab
            native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  iphone:
    if: inputs.platforms != 'android'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - run: npm ci
      - run: npx cap add ios
      - run: npm run icons
      - name: Firebase settings (notifications)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > GoogleService-Info.plist; fi
      - run: npx cap sync ios
      - name: App settings and version
        env:
          APP_VERSION: ${{ inputs.version }}
          APP_BUILD: ${{ github.run_number }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: node prepare-ios.js
      - name: Build, sign and upload to App Store Connect
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::The Apple secrets aren't all set. See docs/APP_STORE_LAUNCH.md, 'Building without a Mac'."
            exit 1
          fi
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic $AUTH archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" $AUTH
          rm -f "$KEY"
